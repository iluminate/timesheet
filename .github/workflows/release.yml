name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      - run: |
          cp target/x86_64-unknown-linux-musl/release/timesheet timesheet-linux-x86_64
          sha256sum timesheet-linux-x86_64 > timesheet-linux-x86_64.sha256
          ./timesheet-linux-x86_64 --version
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            timesheet-linux-x86_64
            timesheet-linux-x86_64.sha256
