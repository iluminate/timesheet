[package]
name = "timesheet"
version = "2.1.0"
edition = "2021"
rust-version = "1.88"
description = "CLI para registrar horas en iEngage (CoForge)"
license = "MIT"
repository = "https://github.com/iluminate/timesheet"
keywords = ["timesheet", "cli"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tungstenite = "0.30"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
zip = { version = "7", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
